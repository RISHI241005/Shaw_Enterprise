spring.application.name=shaw-enterprise
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:3000}
server.forward-headers-strategy=framework
server.servlet.session.cookie.name=shaw_session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:shaw_enterprise}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&useSSL=${MYSQL_SSL:false}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-migration-naming=true

spring.thymeleaf.cache=${TEMPLATE_CACHE:false}
spring.web.resources.static-locations=classpath:/static/,file:./public/
spring.web.resources.cache.cachecontrol.max-age=1h

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=Shaw Enterprise
info.app.version=2.0.0

app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:change-this-admin-password}
app.admin.registration-enabled=${ALLOW_ADMIN_REGISTRATION:false}
app.production=${APP_PRODUCTION:false}
app.otp.secret=${OTP_SECRET:local-otp-secret-change-me}
app.otp.expose-in-response=${DEV_EXPOSE_OTP:true}
app.email.provider=${EMAIL_PROVIDER:dev}
app.email.resend-api-key=${RESEND_API_KEY:}
app.email.from=${EMAIL_FROM:sales@shawenterprise.example}
app.sms.provider=${SMS_PROVIDER:dev}
app.sms.twilio-account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio-auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio-from=${TWILIO_FROM:}

app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:3000/auth/google/callback}
