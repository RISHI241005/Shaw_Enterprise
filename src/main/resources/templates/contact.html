<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Contact', ~{::main})}">
<main><section class="page-title compact"><p class="eyebrow">Contact & directions</p><h1>Send an enquiry or plan your visit.</h1></section>
  <section class="contact-layout">
    <form class="contact-form" method="post" action="/contact"><input type="hidden" name="_csrf" th:value="${csrf}" /><label>Name<input name="name" required maxlength="160" autocomplete="name" /></label><label>Email<input name="email" type="email" required maxlength="180" autocomplete="email" /></label><label>Phone<input name="phone" required maxlength="60" autocomplete="tel" /></label><label>Message<textarea name="message" rows="5" required maxlength="5000"></textarea></label><button class="button primary" type="submit">Send Enquiry</button><p class="form-note contact-note" th:text="${sent != null and sent ? 'Enquiry saved. We will contact you shortly.' : ''}" aria-live="polite"></p></form>
    <aside class="contact-card"><p class="eyebrow">Business details</p><h2 th:text="${business.business_name}"></h2><a class="contact-detail" th:href="${'tel:' + business.phone}" th:text="${business.phone}"></a><a class="contact-detail" th:href="${'mailto:' + business.email}" th:text="${business.email}"></a><p th:text="${business.address}"></p><p th:text="${business.hours}"></p><div class="contact-actions"><a class="button primary" th:href="${business.mapDirectionsUrl}" target="_blank" rel="noopener">Get directions</a><a class="button ghost" th:href="${'https://wa.me/' + business.whatsapp}" target="_blank" rel="noopener">Open WhatsApp</a></div></aside>
    <div class="map-card"><iframe th:src="${business.mapEmbedUrl}" title="Shaw Enterprise location on Google Maps" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe><div><strong>Open on your phone</strong><p>Google Maps will use your current location and guide you to the enterprise.</p><a class="button ghost" th:href="${business.mapDirectionsUrl}" target="_blank" rel="noopener">Navigate with Google Maps</a></div></div>
  </section>
</main></html>
