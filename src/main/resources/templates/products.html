<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Products', ~{::main})}">
<main>
  <section class="page-title catalog-title"><p class="eyebrow">Curated product catalog</p><h1>Everything your business needs, in one place.</h1><p>Browse dependable everyday disposables for shops, events, delivery, and food service.</p></section>
  <section class="band"><div class="catalog-toolbar"><div class="catalog-toolbar-top"><label class="catalog-search-field"><span>⌕</span><input id="productSearch" type="search" placeholder="Search products, categories or uses" /></label><label class="catalog-sort-field"><span>Sort</span><select id="productSort"><option value="featured">Featured first</option><option value="name-asc">Name: A–Z</option><option value="name-desc">Name: Z–A</option></select></label></div><div class="catalog-filter-row" aria-label="Filter products"><button class="filter-chip active" type="button" data-category="all">All <span th:text="${#lists.size(products)}"></span></button><button class="filter-chip" type="button" th:each="category : ${categories}" th:data-category="${#strings.toLowerCase(category)}" th:text="${category}"></button></div><div class="catalog-status"><p id="catalogCount" th:text="${'Showing all ' + #lists.size(products) + ' products'}"></p><p class="catalog-empty" hidden>No products found. Try a different search.</p></div></div>
    <div class="product-grid" id="productGrid"><article class="product-card" th:each="product : ${products}" th:data-product-id="${product.id}" th:data-name="${#strings.toLowerCase(product.name + ' ' + product.category + ' ' + product.summary)}" th:data-category="${#strings.toLowerCase(product.category)}" th:data-summary="${#strings.toLowerCase(product.summary)}" th:data-details="${#strings.toLowerCase(product.details)}" th:data-pack="${#strings.toLowerCase(product.packSize)}" th:data-audience="${#strings.toLowerCase(product.audience)}"><img th:src="${#lists.isEmpty(product.images) ? '/images/product.svg' : product.images[0]}" th:alt="${product.name}" /><div class="product-card-body"><p class="tag" th:text="${product.category}"></p><h3 th:text="${product.name}"></h3><p th:text="${product.summary}"></p><div class="product-meta"><strong th:text="${product.price}"></strong><span th:text="${product.packSize}"></span></div><button class="button small view-product" type="button" th:data-product-id="${product.id}">View Product</button></div></article></div>
  </section><aside class="product-panel" id="productPanel" aria-hidden="true"></aside>
</main></html>
