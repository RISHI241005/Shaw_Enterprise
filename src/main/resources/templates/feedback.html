<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Feedback', ~{::main})}">
<main><section class="page-title compact"><p class="eyebrow">Community feedback</p><h1>Customer feedback and product reviews.</h1></section><section class="feedback-shell" th:attr="data-identity=${identityJson}"><form class="feedback-form" id="feedbackForm"><div id="feedbackIdentity"></div><label>Feedback<textarea name="message" rows="4" placeholder="Share your experience with Shaw Enterprise" required maxlength="5000"></textarea></label><button class="button primary" type="submit">Post Feedback</button><p class="form-note" id="otpNote"></p></form><div class="feedback-toolbar"><strong>Comments</strong><select id="feedbackSort"><option value="top">Top</option><option value="newest">Newest</option></select></div><div id="feedbackList" class="feedback-list"></div><button class="button ghost" id="loadMoreFeedback" type="button">Load More</button></section></main></html>
